<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Menu TV, version simplifiée pour les petites tailles (16 à 48 px) : 3 barres épaisses -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a46"/>
      <stop offset=".55" stop-color="#0c0d26"/>
      <stop offset="1" stop-color="#1c0a33"/>
    </linearGradient>
    <radialGradient id="halo" cx=".62" cy=".5" r=".55">
      <stop offset="0" stop-color="#8b3dff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#5b1fb8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5b1fb8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx=".18" cy=".86" r=".5">
      <stop offset="0" stop-color="#16c8f0" stop-opacity=".28"/>
      <stop offset="1" stop-color="#16c8f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prisme" x1="236" y1="0" x2="796" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22e1ff"/>
      <stop offset=".38" stop-color="#7c5cff"/>
      <stop offset=".7" stop-color="#ff3d8b"/>
      <stop offset="1" stop-color="#ffa33a"/>
    </linearGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lueur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="carre"><rect width="1024" height="1024" rx="232"/></clipPath>
    <g id="barres">
      <rect x="236" y="214" width="250" height="150" rx="75"/>
      <rect x="236" y="437" width="560" height="150" rx="75"/>
      <rect x="236" y="660" width="250" height="150" rx="75"/>
    </g>
  </defs>
  <g clip-path="url(#carre)">
    <rect width="1024" height="1024" fill="url(#fond)"/>
    <rect width="1024" height="1024" fill="url(#halo)"/>
    <rect width="1024" height="1024" fill="url(#halo2)"/>
    <use href="#barres" fill="url(#prisme)" filter="url(#lueur)" opacity=".75"/>
    <use href="#barres" fill="url(#prisme)"/>
    <use href="#barres" fill="url(#reflet)"/>
  </g>
  <rect x="3" y="3" width="1018" height="1018" rx="229" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="6"/>
</svg>
