<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Bannière Fire TV (rangée « Vos applis ») : symbole + nom -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a46"/>
      <stop offset=".55" stop-color="#0c0d26"/>
      <stop offset="1" stop-color="#1c0a33"/>
    </linearGradient>
    <radialGradient id="halo" cx=".3" cy=".5" r=".5">
      <stop offset="0" stop-color="#8b3dff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#5b1fb8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx=".9" cy=".95" r=".45">
      <stop offset="0" stop-color="#16c8f0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#16c8f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prisme" x1="150" y1="0" x2="490" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22e1ff"/>
      <stop offset=".38" stop-color="#7c5cff"/>
      <stop offset=".7" stop-color="#ff3d8b"/>
      <stop offset="1" stop-color="#ffa33a"/>
    </linearGradient>
    <linearGradient id="texte" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d8b"/>
      <stop offset="1" stop-color="#ffa33a"/>
    </linearGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lueur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <g id="barres">
      <rect x="150" y="190" width="125" height="58" rx="29"/>
      <rect x="150" y="275" width="239" height="58" rx="29"/>
      <rect x="150" y="360" width="340" height="58" rx="29"/>
      <rect x="150" y="445" width="239" height="58" rx="29"/>
      <rect x="150" y="530" width="125" height="58" rx="29"/>
    </g>
  </defs>
  <rect width="1280" height="720" fill="url(#fond)"/>
  <rect width="1280" height="720" fill="url(#halo)"/>
  <rect width="1280" height="720" fill="url(#halo2)"/>
  <use href="#barres" fill="url(#prisme)" filter="url(#lueur)" opacity=".75"/>
  <use href="#barres" fill="url(#prisme)"/>
  <use href="#barres" fill="url(#reflet)"/>
  <g font-family="'Segoe UI Black','Segoe UI',Arial,sans-serif" font-weight="900">
    <text x="570" y="392" font-size="150" fill="#fff" letter-spacing="4">MENU</text>
    <text x="574" y="530" font-size="150" fill="url(#texte)" letter-spacing="10">TV</text>
  </g>
</svg>
